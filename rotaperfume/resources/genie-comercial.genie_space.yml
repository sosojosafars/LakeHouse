# The salesperson-facing Genie space. Serialized_space body lives in
# comercial.geniespace.json (see that file's own generation script for the
# deterministic md5 ids) and is inlined via file_path at deploy time.
resources:
  genie_spaces:
    genie_comercial:
      title: 'Rota do Perfume · Comercial'
      description: >-
        Genie para o vendedor individual: consulta sua carteira, a fila de
        ligações da semana e o histórico de um cliente antes de ligar.
      parent_path: ${workspace.root_path}
      warehouse_id: ${var.warehouse_id}
      file_path: ../resources/comercial.geniespace.json
