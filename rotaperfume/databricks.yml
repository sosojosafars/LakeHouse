# This is a Declarative Automation Bundle definition for LakeHousePerfume.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: LakeHousePerfume
  uuid: 2439dd0a-c26d-4202-84fb-bfb7698e34e5

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: >-
      The schema used by the sample template resources (pipeline/job).
      The rotaperfume medallion layers (bronze/silver/gold, see resources/catalogo.yml)
      are fixed schema names, independent of this variable.
  warehouse_id:
    description: SQL warehouse used by scripts/*.sh bootstrap queries and by the silver_* sql_task's in resources/pipeline.job.yml
    default: 10eb01bbaddccb09 # Serverless Starter Warehouse

targets:
  dev:
    # NOT using 'mode: development' here: in dev mode, Unity Catalog schema resources
    # (resources/catalogo.yml) get their names prefixed with 'dev_<user>_', which would
    # rename bronze/silver/gold to dev_<user>_bronze/etc. and break every fixed-name
    # reference to them across this pipeline's tasks. Pause the job schedule explicitly
    # instead, which is the effect we actually want from "dev".
    default: true
    presets:
      trigger_pause_status: PAUSED
    workspace:
      host: https://dbc-ba1b94f4-364f.cloud.databricks.com
    variables:
      catalog: lakehouse_rotaperfume
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-ba1b94f4-364f.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/sofiajosafa19@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/sofiajosafa19@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: lakehouse_rotaperfume
      schema: prod
    permissions:
      - user_name: sofiajosafa19@gmail.com
        level: CAN_MANAGE
